# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build

on:
  push:
    branches: ['main']
    paths:
      - 'flaml/**'
      - 'test/**'
      - 'notebook/**'
      - '.github/workflows/python-package.yml'
      - '.coveragerc'
      - 'pyproject.toml'
      - 'setup.py'
  pull_request:
    branches: ['main']
    paths:
      - 'flaml/**'
      - 'test/**'
      - 'notebook/**'
      - '.github/workflows/python-package.yml'
      - '.coveragerc'
      - 'pyproject.toml'
      - 'setup.py'
  merge_group:
    types: [checks_requested]
  schedule:
    # Every other day at 02:00 UTC
    - cron: '0 2 */2 * *'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  public-install:
    name: Public install (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test isolated core, AutoML, AutoFE, and autozero defaults
        shell: python
        run: |
          import os
          import subprocess
          import venv
          from pathlib import Path

          checkout = Path.cwd()
          smoke_test = checkout / "test" / "check_public_install.py"
          for profile, extra, flags in (
              ("core", "", []),
              ("automl", "[automl]", ["--automl"]),
              ("autofe", "[autofe]", ["--autofe"]),
              ("autozero", "[autozero]", ["--autozero"]),
          ):
              environment = Path(os.environ["RUNNER_TEMP"]) / f"flaml-public-install-{profile}"
              venv.create(environment, with_pip=True)
              python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run(
                  [str(python), "-m", "pip", "install", str(checkout) + extra],
                  check=True, cwd=environment,
              )
              subprocess.run(
                  [str(python), str(smoke_test)] + flags,
                  check=True, cwd=environment,
              )

  build:

    runs-on: ${{ matrix.os }}
    env:
      # Avoid Tk lifecycle crashes during asynchronous MLflow logging on Windows.
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        test-type: [notspark]
        exclude:
          - os: windows-11-arm
            python-version: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Java 17 for Spark
        if: matrix.os == 'ubuntu-latest' && matrix.python-version != '3.10'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: On mac, install libomp to facilitate lgbm and xgboost install
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install libomp
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          export CPPFLAGS="$CPPFLAGS -Xpreprocessor -fopenmp"
          export CFLAGS="$CFLAGS -I/usr/local/opt/libomp/include"
          export CXXFLAGS="$CXXFLAGS -I/usr/local/opt/libomp/include"
          export LDFLAGS="$LDFLAGS -Wl,-rpath,/usr/local/opt/libomp/lib -L/usr/local/opt/libomp/lib -lomp"
      # Newer ARM64 wheels require Python >=3.12. Build the compatible release
      # explicitly for ARM64 and validate the DLL header before Python loads it.
      - name: Build native XGBoost for Windows ARM64 Python 3.11
        if: matrix.os == 'windows-11-arm' && matrix.python-version == '3.11'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel "setuptools<82"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Join-Path $env:RUNNER_TEMP 'xgboost-arm64-py311'
          $build = Join-Path $source 'build-arm64'
          git clone --depth 1 --branch v3.2.0 --recurse-submodules --shallow-submodules https://github.com/dmlc/xgboost.git $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S $source -B $build -G 'Visual Studio 18 2026' -A ARM64 -DUSE_CUDA=OFF -DUSE_OPENMP=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $library = Join-Path $source 'lib\xgboost.dll'
          python -c "import pathlib,struct,sys; data=pathlib.Path(sys.argv[1]).read_bytes(); offset=struct.unpack_from('<I',data,0x3c)[0]; machine=struct.unpack_from('<H',data,offset+4)[0]; assert machine == 0xaa64, hex(machine); print('Built DLL machine:',hex(machine))" $library
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-cache-dir (Join-Path $source 'python-package')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import importlib.util,pathlib,platform,struct; assert platform.machine() == 'ARM64'; spec=importlib.util.find_spec('xgboost'); data=(pathlib.Path(spec.origin).parent/'lib'/'xgboost.dll').read_bytes(); offset=struct.unpack_from('<I',data,0x3c)[0]; assert struct.unpack_from('<H',data,offset+4)[0] == 0xaa64; import numpy as np,xgboost; X=np.arange(16).reshape(8,2); model=xgboost.train({'objective':'binary:logistic','nthread':1},xgboost.DMatrix(X,label=np.tile([0,1],4)),num_boost_round=2); assert len(model.predict(xgboost.DMatrix(X[:2]))) == 2; print('Native ARM64 XGBoost',xgboost.__version__,'fit/predict passed')"
      - name: Install packages and dependencies
        run: |
          python -m pip install --upgrade pip wheel "setuptools<82"
          pip install -e .
          python -c "import flaml"
          pip install -e .[test]
          pip install coverage
      # When pytest-xdist spawns worker subprocesses, they don't inherit
      # `coverage run`'s instrumentation. The canonical fix is a .pth file
      # in site-packages that calls coverage.process_startup() on every
      # interpreter start, gated by the COVERAGE_PROCESS_START env var
      # (set per test step below). See https://coverage.readthedocs.io/
      # en/latest/subprocess.html.
      - name: Enable coverage in subprocesses (for pytest-xdist workers)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          SITE_PACKAGES=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "import coverage; coverage.process_startup()" > "$SITE_PACKAGES/coverage_subprocess.pth"
          echo "Wrote $SITE_PACKAGES/coverage_subprocess.pth"
      # # TODO: support ray
      # - name: If linux and python<3.11, install ray 2
      #   if: matrix.os == 'ubuntu-latest' && matrix.python-version < '3.11'
      #   run: |
      #     pip install "ray[tune]<2.5.0"
      - name: Install prophet when on linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install -e .[forecast]
      # TODO: support vw for python 3.10+
      - name:  If linux and python<3.10, install vw
        if: matrix.os == 'ubuntu-latest' && matrix.python-version < '3.10'
        run: |
          pip install -e .[vw]
      - name: Pip freeze
        run: |
          pip freeze
      - name: Check dependencies
        run: |
          python test/check_dependency.py
      - name: Clear pip cache
        run: |
          pip cache purge
      # Spark-marked tests run in the separate container-cluster job below.
      - name: Test with pytest (notspark)
        if: matrix.test-type == 'notspark'
        # Python 3.10 uses older pinned deps (xgboost<2, etc.) that run
        # the AutoML/forecast suite roughly 2x slower than 3.11+. Even
        # with xdist -n 2, 3.10 wall time on ubuntu/windows lands at
        # ~120-125 min; 180 gives headroom for occasional flake reruns.
        # 3.11/3.12/3.13 typically finish in 60-100 min on this step.
        timeout-minutes: 180
        shell: bash
        env:
          # Tells the coverage_subprocess.pth file (created above) to
          # auto-start coverage in pytest-xdist worker processes using
          # this config. Without this, subprocess test code wouldn't
          # be measured.
          COVERAGE_PROCESS_START: ${{ matrix.os == 'ubuntu-latest' && format('{0}/.coveragerc', github.workspace) || '' }}
        run: |
          # -n 2 --dist=loadfile parallelizes tests across 2 worker
          # procs (GitHub-hosted runners have 4 vCPU; 2 workers leaves
          # ~2 cores per worker for lightgbm/xgboost/sklearn internal
          # threading, avoiding CPU oversubscription that hurts wall
          # time more than it helps). loadfile keeps tests from the
          # same file together so module-level fixtures aren't
          # re-imported per test.
          runner=(python)
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            runner=(coverage run)
          fi
          "${runner[@]}" -m pytest test/ \
            -n 2 --dist=loadfile \
            --ignore=test/autogen \
            --ignore=test/spark \
            --ignore=test/nlp \
            --ignore=test/automl/test_extra_models.py \
            --reruns 2 --reruns-delay 10 \
            -m "not spark"
      - name: Test offline NLP utilities and classification heads
        if: matrix.os != 'windows-11-arm' && matrix.test-type == 'notspark'
        timeout-minutes: 30
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          COVERAGE_PROCESS_START: ${{ matrix.os == 'ubuntu-latest' && format('{0}/.coveragerc', github.workspace) || '' }}
        run: |
          runner=(python)
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            runner=(coverage run)
          fi
          "${runner[@]}" -m pytest \
            test/nlp/test_hf_utils_coverage.py \
            test/nlp/test_autohf_classificationhead.py \
            test/nlp/test_default.py::test_build_portfolio \
            test/nlp/test_default.py::test_starting_point_not_in_search_space \
            --reruns 2 --reruns-delay 10
      # .coveragerc enables `parallel = true`, so each subprocess writes its
      # own .coverage.<host>.<pid>.<rand> shard. Combine them into a single
      # per-job .coverage file so one artifact = one job's coverage.
      - name: Combine per-job coverage data
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          TEST_JOB_RESULT: ${{ job.status }}
        run: |
          set -e
          shopt -s nullglob
          shards=( .coverage.* )
          if [ ! -f .coverage ] && [ ${#shards[@]} -eq 0 ]; then
            if [ "${TEST_JOB_RESULT:-success}" = "success" ]; then
              echo "::error::Successful Ubuntu tests produced no coverage data."
              exit 1
            fi
            echo "No coverage data after an unsuccessful test job; skipping combine."
            exit 0
          fi
          if [ ${#shards[@]} -gt 0 ]; then
            coverage combine
          fi
      - name: Upload coverage data artifact
        if: always() && matrix.os == 'ubuntu-latest' && hashFiles('.coverage') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-data-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.test-type }}
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Prepare dependency snapshot
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && matrix.test-type == 'notspark'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/flaml-dependencies"
          pip freeze > "$RUNNER_TEMP/flaml-dependencies/installed_all_dependencies_3.11_ubuntu-latest.txt"
          python test/check_dependency.py > "$RUNNER_TEMP/flaml-dependencies/installed_first_tier_dependencies_3.11_ubuntu-latest.txt"
          coverage xml -o "$RUNNER_TEMP/flaml-dependencies/coverage_3.11_ubuntu-latest.xml"
      - name: Upload dependency snapshot
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && matrix.test-type == 'notspark'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-snapshot
          path: ${{ runner.temp }}/flaml-dependencies/
          if-no-files-found: error
          retention-days: 1

  save-dependencies:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: flaml-dependency-snapshots
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: unit-tests-installed-dependencies
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-snapshot
          path: dependency-snapshot
      - name: Publish completed main-branch snapshot
        run: |
          cp dependency-snapshot/installed_all_dependencies_3.11_ubuntu-latest.txt .
          cp dependency-snapshot/installed_first_tier_dependencies_3.11_ubuntu-latest.txt .
          cp dependency-snapshot/coverage_3.11_ubuntu-latest.xml .
          git add -f -- installed_all_dependencies_3.11_ubuntu-latest.txt installed_first_tier_dependencies_3.11_ubuntu-latest.txt coverage_3.11_ubuntu-latest.xml
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m "Update installed dependencies for Python 3.11 on ubuntu-latest"
          git push origin HEAD:refs/heads/unit-tests-installed-dependencies

  spark:
    name: build (ubuntu-latest, ${{ matrix.python-version }}, spark)
    runs-on: ubuntu-latest
    timeout-minutes: 160
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            spark-version: "3.5.1"
            runtime-id: py311
          - python-version: "3.12"
            spark-version: "4.0.1"
            runtime-id: py312
          - python-version: "3.13"
            spark-version: "4.1.0"
            runtime-id: py313
    env:
      COMPOSE_FILE: test/spark/containers/compose.yml
      COMPOSE_PROJECT_NAME: flaml-spark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runtime-id }}
      PYTHON_VERSION: ${{ matrix.python-version }}
      SPARK_VERSION: ${{ matrix.spark-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare coverage collection
        run: |
          echo "SPARK_TEST_OUTPUT=$RUNNER_TEMP/flaml-spark-results" >> "$GITHUB_ENV"
          python -m pip install coverage
      - name: Build matching driver and worker image
        timeout-minutes: 20
        run: |
          mkdir -p "$SPARK_TEST_OUTPUT"
          docker compose config --quiet
          docker compose build master
      - name: Start standalone master and two worker containers
        timeout-minutes: 5
        run: docker compose up -d --wait --wait-timeout 180 --scale worker=2 master worker
      - name: Verify remote executors and run Spark tests
        timeout-minutes: 120
        run: docker compose run --name "${COMPOSE_PROJECT_NAME}-driver" --use-aliases driver
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p "$SPARK_TEST_OUTPUT"
          docker compose logs --no-color --timestamps > "$SPARK_TEST_OUTPUT/cluster.log"
          if docker container inspect "${COMPOSE_PROJECT_NAME}-driver" > /dev/null 2>&1; then
            docker logs --timestamps "${COMPOSE_PROJECT_NAME}-driver" > "$SPARK_TEST_OUTPUT/driver.log" 2>&1
          fi
      - name: Stop this job's cluster
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Combine container coverage
        id: spark-coverage
        if: always()
        env:
          TEST_JOB_RESULT: ${{ job.status }}
          COVERAGE_FILE: ${{ runner.temp }}/flaml-spark-results/.coverage
        run: |
          shopt -s nullglob
          shards=( "$SPARK_TEST_OUTPUT"/.coverage.* )
          if [ ! -f "$COVERAGE_FILE" ] && [ ${#shards[@]} -eq 0 ]; then
            if [ "$TEST_JOB_RESULT" = "success" ]; then
              echo "::error::Successful Spark tests produced no coverage data."
              exit 1
            fi
            echo "No coverage data after an unsuccessful Spark job."
            exit 0
          fi
          if [ ${#shards[@]} -gt 0 ]; then
            coverage combine "$SPARK_TEST_OUTPUT"
          fi
          echo "has-data=true" >> "$GITHUB_OUTPUT"
      - name: Upload Spark coverage
        if: always() && steps.spark-coverage.outputs.has-data == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-data-ubuntu-latest-py${{ matrix.python-version }}-spark
          path: ${{ runner.temp }}/flaml-spark-results/.coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload Spark diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spark-cluster-py${{ matrix.python-version }}-${{ matrix.spark-version }}
          path: |
            ${{ runner.temp }}/flaml-spark-results/*.log
            ${{ runner.temp }}/flaml-spark-results/pytest.xml

  # Combine coverage data files from every test-matrix job into a single
  # XML report and upload it to Codecov as one merged result. Coverage is
  # only collected on Linux runners (see the build job) to avoid path
  # mismatches between Linux and Windows in the combined data file.
  coverage:
    name: Combine coverage and upload to Codecov
    if: always()
    needs: [build, spark]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install coverage
        run: pip install coverage
      - name: Download all coverage data artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: coverage_artifacts
          pattern: coverage-data-*
      - name: Combine coverage data and produce XML
        shell: bash
        env:
          BUILD_MATRIX_RESULT: ${{ needs.build.result == 'success' && needs.spark.result == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p combined
          i=0
          for f in coverage_artifacts/*/.coverage; do
            i=$((i + 1))
            cp "$f" "combined/.coverage.$i"
          done
          if [ "$i" -eq 0 ]; then
            if [ "${BUILD_MATRIX_RESULT:-success}" = "success" ]; then
              echo "::error::Successful build jobs uploaded no coverage data."
              exit 1
            fi
            echo "No coverage data after unsuccessful build jobs; skipping aggregation."
            exit 0
          fi
          echo "Combining $i coverage data files..."
          coverage combine combined/.coverage.*
          coverage xml -i -o coverage.xml
          # Print a textual summary into the job log for quick debugging.
          coverage report -m || true
      - name: Upload combined coverage to Codecov
        if: hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Use the repository upload token from Codecov's settings page
          # (added as the CODECOV_TOKEN repo secret). This is what reliably
          # triggers the codecov-commenter PR comment -- OIDC tokenless
          # uploads alone (without an explicit repo-scoped token) appear
          # to bypass the comment notification path for this repo.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: flaml-combined-coverage
          fail_ci_if_error: false
          verbose: true
      # Post a coverage comment directly on the PR via GITHUB_TOKEN.
      # Codecov's own codecov-commenter is currently silent on this
      # repo (uploads still go to the Codecov dashboard above for trend
      # tracking, but the in-PR comment uses this action instead).
      # Build the comment from the Cobertura coverage.xml artifact via
      # `pytest-xml-coverage-path`; no pytest text-summary file is produced.
      - name: Post coverage comment to PR
        if: hashFiles('coverage.xml') != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@637da55541a2c0e160cbe17c914b92c6a7a3ee67
        with:
          pytest-xml-coverage-path: ./coverage.xml
          title: Coverage Report
          badge-title: coverage
          hide-badge: false
          hide-report: false
          create-new-comment: false
          unique-id-for-comment: pytest-coverage-comment
