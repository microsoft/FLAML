# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build

on:
  push:
    branches: ['main']
    paths:
      - 'flaml/**'
      - 'test/**'
      - 'notebook/**'
      - '.github/workflows/python-package.yml'
      - 'pyproject.toml'
      - 'setup.py'
  pull_request:
    branches: ['main']
    paths:
      - 'flaml/**'
      - 'test/**'
      - 'notebook/**'
      - '.github/workflows/python-package.yml'
      - 'pyproject.toml'
      - 'setup.py'
  merge_group:
    types: [checks_requested]
  schedule:
    # Every other day at 02:00 UTC
    - cron: '0 2 */2 * *'

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  public-install:
    name: Public install (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    env:
      FLAML_FABRIC_RUNTIME: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test isolated core, AutoML, and AutoFE installations
        shell: python
        run: |
          import os
          import subprocess
          import venv
          from pathlib import Path

          checkout = Path.cwd()
          smoke_test = checkout / "test" / "check_public_install.py"
          for profile, extra, flags in (
              ("core", "", []),
              ("automl", "[automl]", ["--automl"]),
              ("autofe", "[autofe]", ["--autofe"]),
          ):
              environment = Path(os.environ["RUNNER_TEMP"]) / f"flaml-public-install-{profile}"
              venv.create(environment, with_pip=True)
              python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run(
                  [str(python), "-m", "pip", "install", str(checkout) + extra],
                  check=True, cwd=environment,
              )
              subprocess.run(
                  [str(python), str(smoke_test)] + flags,
                  check=True, cwd=environment,
              )

  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        test-type: [notspark, spark]
        exclude:
          # OSS CI does not install pyspark on Windows runners.
          - os: windows-latest
            test-type: spark
          - os: windows-11-arm
            test-type: spark
          # OSS CI does not install pyspark on Python 3.10.
          - python-version: "3.10"
            test-type: spark
          - os: windows-11-arm
            python-version: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: On mac, install libomp to facilitate lgbm and xgboost install
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install libomp
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          export CPPFLAGS="$CPPFLAGS -Xpreprocessor -fopenmp"
          export CFLAGS="$CFLAGS -I/usr/local/opt/libomp/include"
          export CXXFLAGS="$CXXFLAGS -I/usr/local/opt/libomp/include"
          export LDFLAGS="$LDFLAGS -Wl,-rpath,/usr/local/opt/libomp/lib -L/usr/local/opt/libomp/lib -lomp"
      # Newer ARM64 wheels require Python >=3.12. Build the compatible release
      # explicitly for ARM64 and validate the DLL header before Python loads it.
      - name: Build native XGBoost for Windows ARM64 Python 3.11
        if: matrix.os == 'windows-11-arm' && matrix.python-version == '3.11'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel "setuptools<82"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Join-Path $env:RUNNER_TEMP 'xgboost-arm64-py311'
          $build = Join-Path $source 'build-arm64'
          git clone --depth 1 --branch v3.2.0 --recurse-submodules --shallow-submodules https://github.com/dmlc/xgboost.git $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S $source -B $build -G 'Visual Studio 17 2022' -A ARM64 -DUSE_CUDA=OFF -DUSE_OPENMP=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $library = Join-Path $source 'lib\xgboost.dll'
          python -c "import pathlib,struct,sys; data=pathlib.Path(sys.argv[1]).read_bytes(); offset=struct.unpack_from('<I',data,0x3c)[0]; machine=struct.unpack_from('<H',data,offset+4)[0]; assert machine == 0xaa64, hex(machine); print('Built DLL machine:',hex(machine))" $library
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-cache-dir (Join-Path $source 'python-package')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import importlib.util,pathlib,platform,struct; assert platform.machine() == 'ARM64'; spec=importlib.util.find_spec('xgboost'); data=(pathlib.Path(spec.origin).parent/'lib'/'xgboost.dll').read_bytes(); offset=struct.unpack_from('<I',data,0x3c)[0]; assert struct.unpack_from('<H',data,offset+4)[0] == 0xaa64; import numpy as np,xgboost; X=np.arange(16).reshape(8,2); model=xgboost.XGBClassifier(n_estimators=2,n_jobs=1).fit(X,np.tile([0,1],4)); assert len(model.predict(X[:2])) == 2; print('Native ARM64 XGBoost',xgboost.__version__,'fit/predict passed')"
      - name: Install packages and dependencies
        run: |
          python -m pip install --upgrade pip wheel "setuptools<82"
          pip install -e .
          python -c "import flaml"
          pip install -e .[test]
          pip install coverage
      # When pytest-xdist spawns worker subprocesses, they don't inherit
      # `coverage run`'s instrumentation. The canonical fix is a .pth file
      # in site-packages that calls coverage.process_startup() on every
      # interpreter start, gated by the COVERAGE_PROCESS_START env var
      # (set per test step below). See https://coverage.readthedocs.io/
      # en/latest/subprocess.html.
      - name: Enable coverage in subprocesses (for pytest-xdist workers)
        shell: bash
        run: |
          SITE_PACKAGES=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "import coverage; coverage.process_startup()" > "$SITE_PACKAGES/coverage_subprocess.pth"
          echo "Wrote $SITE_PACKAGES/coverage_subprocess.pth"
      # Only Spark jobs need this compatibility cap. Non-Spark jobs should
      # exercise the current pandas version allowed by their dependencies.
      - name: On Ubuntu with pyspark, pin pandas<3 (pyspark doesn't support pandas 3.0 yet)
        if: matrix.os == 'ubuntu-latest' && matrix.test-type == 'spark'
        run: |
          pip install "pandas>=2.0,<3"
      - name: On Ubuntu python 3.11, install pyspark 3.5.1
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest' && matrix.test-type == 'spark'
        run: |
          pip install pyspark==3.5.1
          pip list | grep "pyspark"
      - name: On Ubuntu python 3.12, install pyspark 4.0.1
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' && matrix.test-type == 'spark'
        run: |
          pip install pyspark==4.0.1
          pip list | grep "pyspark"
      - name: On Ubuntu python 3.13, install pyspark 4.1.0
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest' && matrix.test-type == 'spark'
        run: |
          pip install pyspark==4.1.0
          pip list | grep "pyspark"
      # # TODO: support ray
      # - name: If linux and python<3.11, install ray 2
      #   if: matrix.os == 'ubuntu-latest' && matrix.python-version < '3.11'
      #   run: |
      #     pip install "ray[tune]<2.5.0"
      - name: Install prophet when on linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install -e .[forecast]
      # TODO: support vw for python 3.10+
      - name:  If linux and python<3.10, install vw
        if: matrix.os == 'ubuntu-latest' && matrix.python-version < '3.10'
        run: |
          pip install -e .[vw]
      - name: Pip freeze
        run: |
          pip freeze
      - name: Check dependencies
        run: |
          python test/check_dependency.py
      - name: Clear pip cache
        run: |
          pip cache purge
      # Tests are split into a "notspark" variant (everything except Spark
      # tests, with `-m "not spark"`) and a "spark" variant (only Spark
      # tests, with `-m "spark"`), mirroring the internal Azure DevOps
      # pipeline at .pipelines/build.yml in the internal fork.
      - name: Test with pytest (notspark)
        if: matrix.test-type == 'notspark'
        # Python 3.10 uses older pinned deps (xgboost<2, etc.) that run
        # the AutoML/forecast suite roughly 2x slower than 3.11+. Even
        # with xdist -n 2, 3.10 wall time on ubuntu/windows lands at
        # ~120-125 min; 180 gives headroom for occasional flake reruns.
        # 3.11/3.12/3.13 typically finish in 60-100 min on this step.
        timeout-minutes: 180
        shell: bash
        env:
          # Tells the coverage_subprocess.pth file (created above) to
          # auto-start coverage in pytest-xdist worker processes using
          # this config. Without this, subprocess test code wouldn't
          # be measured.
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
        run: |
          # -n 2 --dist=loadfile parallelizes tests across 2 worker
          # procs (GitHub-hosted runners have 4 vCPU; 2 workers leaves
          # ~2 cores per worker for lightgbm/xgboost/sklearn internal
          # threading, avoiding CPU oversubscription that hurts wall
          # time more than it helps). loadfile keeps tests from the
          # same file together so module-level fixtures aren't
          # re-imported per test.
          coverage run -m pytest test/ \
            -n 2 --dist=loadfile \
            --ignore=test/autogen \
            --ignore=test/spark \
            --ignore=test/nlp \
            --ignore=test/automl/test_extra_models.py \
            --reruns 2 --reruns-delay 10 \
            -m "not spark"
      - name: Test with pytest (spark)
        if: matrix.test-type == 'spark'
        timeout-minutes: 120
        shell: bash
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
        run: |
          # Spark tests are kept serial: SynapseML's SparkSession is a
          # single global JVM instance and the Spark workers themselves
          # already parallelize, so pytest-level parallelism would
          # contend on the same JVM and hurt rather than help. They
          # already run in ~20 min.
          coverage run -m pytest test/ \
            --ignore=test/autogen \
            --ignore=test/nlp \
            --ignore=test/spark/test_internal_mlflow.py \
            --reruns 2 --reruns-delay 10 \
            -m "spark"
      - name: Test offline NLP utilities and classification heads
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10' && matrix.test-type == 'notspark'
        timeout-minutes: 30
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
        run: |
          coverage run -m pytest \
            test/nlp/test_hf_utils_coverage.py \
            test/nlp/test_autohf_classificationhead.py \
            --reruns 2 --reruns-delay 10
      # .coveragerc enables `parallel = true`, so each subprocess writes its
      # own .coverage.<host>.<pid>.<rand> shard. Combine them into a single
      # per-job .coverage file so one artifact = one job's coverage.
      - name: Combine per-job coverage data
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          TEST_JOB_RESULT: ${{ job.status }}
        run: |
          set -e
          shopt -s nullglob
          shards=( .coverage.* )
          if [ ! -f .coverage ] && [ ${#shards[@]} -eq 0 ]; then
            if [ "${TEST_JOB_RESULT:-success}" = "success" ]; then
              echo "::error::Successful Ubuntu tests produced no coverage data."
              exit 1
            fi
            echo "No coverage data after an unsuccessful test job; skipping combine."
            exit 0
          fi
          if [ ${#shards[@]} -gt 0 ]; then
            coverage combine
          fi
      - name: Upload coverage data artifact
        if: always() && matrix.os == 'ubuntu-latest' && hashFiles('.coverage') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-data-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.test-type }}
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Save dependencies
        # Run for a single matrix entry on push to main to avoid concurrent
        # writes to the unit-tests-installed-dependencies branch.
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && matrix.test-type == 'notspark'
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config advice.addIgnoredFile false

          BRANCH=unit-tests-installed-dependencies
          git fetch origin
          git checkout -B "$BRANCH" "origin/$BRANCH"

          pip freeze > installed_all_dependencies_${{ matrix.python-version }}_${{ matrix.os }}.txt
          python test/check_dependency.py > installed_first_tier_dependencies_${{ matrix.python-version }}_${{ matrix.os }}.txt
          git add installed_*dependencies*.txt
          coverage xml -o ./coverage_${{ matrix.python-version }}_${{ matrix.os }}.xml || true
          git add -f ./coverage_${{ matrix.python-version }}_${{ matrix.os }}.xml || true
          git commit -m "Update installed dependencies for Python ${{ matrix.python-version }} on ${{ matrix.os }}" || exit 0
          git push origin "$BRANCH" --force

  # Combine coverage data files from every test-matrix job into a single
  # XML report and upload it to Codecov as one merged result. Coverage is
  # only collected on Linux runners (see the build job) to avoid path
  # mismatches between Linux and Windows in the combined data file.
  coverage:
    name: Combine coverage and upload to Codecov
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install coverage
        run: pip install coverage
      - name: Download all coverage data artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: coverage_artifacts
          pattern: coverage-data-*
      - name: Combine coverage data and produce XML
        shell: bash
        env:
          BUILD_MATRIX_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p combined
          i=0
          for f in coverage_artifacts/*/.coverage; do
            i=$((i + 1))
            cp "$f" "combined/.coverage.$i"
          done
          if [ "$i" -eq 0 ]; then
            if [ "${BUILD_MATRIX_RESULT:-success}" = "success" ]; then
              echo "::error::Successful build jobs uploaded no coverage data."
              exit 1
            fi
            echo "No coverage data after unsuccessful build jobs; skipping aggregation."
            exit 0
          fi
          echo "Combining $i coverage data files..."
          coverage combine combined/.coverage.*
          coverage xml -i -o coverage.xml
          # Print a textual summary into the job log for quick debugging.
          coverage report -m || true
      - name: Upload combined coverage to Codecov
        if: hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Use the repository upload token from Codecov's settings page
          # (added as the CODECOV_TOKEN repo secret). This is what reliably
          # triggers the codecov-commenter PR comment -- OIDC tokenless
          # uploads alone (without an explicit repo-scoped token) appear
          # to bypass the comment notification path for this repo.
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: flaml-combined-coverage
          fail_ci_if_error: false
          verbose: true
      # Post a coverage comment directly on the PR via GITHUB_TOKEN.
      # Codecov's own codecov-commenter is currently silent on this
      # repo (uploads still go to the Codecov dashboard above for trend
      # tracking, but the in-PR comment uses this action instead).
      # Build the comment from the Cobertura coverage.xml artifact via
      # `pytest-xml-coverage-path`; no pytest text-summary file is produced.
      - name: Post coverage comment to PR
        if: hashFiles('coverage.xml') != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@637da55541a2c0e160cbe17c914b92c6a7a3ee67
        with:
          pytest-xml-coverage-path: ./coverage.xml
          title: Coverage Report
          badge-title: coverage
          hide-badge: false
          hide-report: false
          create-new-comment: false
          unique-id-for-comment: pytest-coverage-comment
