spark.master spark://master:7077
spark.driver.host driver
spark.driver.bindAddress 0.0.0.0
spark.driver.memory 2g
# Reserve one core per worker for notebook kernels that start a second application.
spark.cores.max 2
spark.executor.cores 1
spark.executor.memory 1g
spark.default.parallelism 2
spark.sql.shuffle.partitions 4
spark.dynamicAllocation.enabled false
spark.scheduler.minRegisteredResourcesRatio 1.0
spark.scheduler.maxRegisteredResourcesWaitingTime 120s
spark.task.maxFailures 1
spark.executorEnv.COVERAGE_PROCESS_START /workspace/.coveragerc
spark.executorEnv.COVERAGE_FILE /coverage/.coverage
